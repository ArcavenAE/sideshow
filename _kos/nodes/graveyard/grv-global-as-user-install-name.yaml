id: grv-global-as-user-install-name
type: graveyard
confidence: graveyard
title: "naming the user-scoped install 'global'"
content: |
  An earlier iteration of the install architecture called the
  `~/.local/share/sideshow/packs/` location "global". Session-029
  user correction: that name is wrong. True global is OS-wide (one
  install for all users on a machine) and sideshow has no purpose for
  that — install is and always will be user-scoped.

  Renamed to "user-install" everywhere. The `~/` path makes the
  user-scope nature obvious; the name should match.

  This was a small but load-bearing correction: it kept future discussion
  of "do we ever need OS-wide?" on solid ground rather than colliding
  with the existing "global" terminology.
