id: question-customization-bridge
type: question
confidence: frontier
title: "How does sideshow bridge between upstream-defined custom/ surfaces and checked-in _{pack}-custom/?"
tags:
  - sideshow
  - customization
  - bmad-65
content: |
  bmad 6.4 introduced `_bmad/custom/` as the upstream-defined per-project
  customization surface, with TOML files and an authoring skill
  (`bmad-customize`). The upstream's runtime resolver expects to find
  customization at that path.

  Sideshow's own per-repo customization lives at `_{pack}-custom/`
  (checked-in territory, see `elem-per-repo-customization`). Two
  customization conventions, one customization need — the bridge
  collapses them into a single surface.

  Resolution: at project init, render a gitignored symlink
  `_bmad/custom/ → ../_bmad-custom/`. The upstream's runtime and
  authoring skills write transparently into checked-in territory.
  Customization survives version switches (`_bmad/` may be replaced;
  `_bmad-custom/` does not move).

  **RESOLVED 2026-07-12 → elem-custom-bridge.** Implementation shipped
  (sideshow PR #47 + template seeding in PR #48; `aae-orc-mkpo`
  closed), E2E validated against a real installed bmad 6.10.0
  (creation, idempotency, write-through — aae-orc finding-072).
  Boundary doc `docs/customization-bridge.md` graduated into the
  bedrock element. `aae-orc-10vq` (overlay spec) is unblocked.

  The open sub-questions resolved as:
  - Packs without an upstream custom/ convention: no `custom_bridge`
    declaration → no bridge; `_{pack}-custom/` alone suffices.
  - Upstream structural changes: absorbed at pack-build time by
    changing the declaration in newer bundles (declaration-driven,
    not version-sniffed).
  - Symlink validation: doctor (`aae-orc-xteh`) + cross-pack binding
    ownership (`aae-orc-em8e`) own detection; refuse-on-conflict
    semantics protect at creation time.
