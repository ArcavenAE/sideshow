# CCMP pack-weave declaration.
# Ported from scripts/bmad-post-update.sh (240 lines) at 2026-07-31.
# Parity target: the behavior of that script, not its stated intent. See the
# two recorded divergences at the bottom of this file.
schema_version: 0.1.0
pack: bmad

vars:
  project: ccmp

custom_agents:
  - id: platform-engineer
    name: Sam
    source: _bmad-custom/agents/sam-platform-engineer.md
    slash_command_id: bmad-agent-custom-{{project}}-sam

csv_injections:
  - name: agent-manifest
    target: _bmad/_config/agent-manifest.csv
    guard: '"platform-engineer"'
    rows:
      - |-
        "platform-engineer","Sam","Platform Engineer","⚙️","Platform Engineer & DevOps Architect","Expert in CI/CD pipelines, Kubernetes, Infrastructure as Code, GitOps, and observability platforms. Automation-focused, reliability-oriented, developer-productivity minded.","Automation-focused, reliability-oriented. Speaks in pipelines, containers, and deployment strategies. Infrastructure as code advocate. Direct and practical.","- Automation First: Automate everything repeatable - Infrastructure as Code: Version control all infrastructure - GitOps: Git as single source of truth for operations - Immutable Infrastructure: Never modify, always replace - Security by Default: Shift security left","custom","_bmad-custom/agents/sam-platform-engineer.md"

  - name: bmad-help
    target: _bmad/_config/bmad-help.csv
    guard: 'bmad-agent-custom-{{project}}-sam'
    rows:
      - |-
        custom,anytime,Design CI/CD Pipeline,DP,,_bmad-custom/agents/sam-platform-engineer.md,bmad-agent-custom-ccmp-sam,false,platform-engineer,bmad:Automation-focused reliability-oriented:agent:platform-engineer,Sam,⚙️ Platform Engineer,Create Mode,Design CI/CD pipeline with automated testing and deployment,output_folder,pipeline design
      - |-
        custom,anytime,Design Kubernetes,DK,,_bmad-custom/agents/sam-platform-engineer.md,bmad-agent-custom-ccmp-sam,false,platform-engineer,bmad:Automation-focused reliability-oriented:agent:platform-engineer,Sam,⚙️ Platform Engineer,Create Mode,Design Kubernetes cluster architecture and deployment strategy,output_folder,kubernetes design
      - |-
        custom,anytime,Design IaC,DI,,_bmad-custom/agents/sam-platform-engineer.md,bmad-agent-custom-ccmp-sam,false,platform-engineer,bmad:Automation-focused reliability-oriented:agent:platform-engineer,Sam,⚙️ Platform Engineer,Create Mode,Create Infrastructure as Code strategy,output_folder,iac strategy
      - |-
        custom,anytime,Design Observability,DO,,_bmad-custom/agents/sam-platform-engineer.md,bmad-agent-custom-ccmp-sam,false,platform-engineer,bmad:Automation-focused reliability-oriented:agent:platform-engineer,Sam,⚙️ Platform Engineer,Create Mode,Design monitoring logging and tracing architecture,output_folder,observability design
      - |-
        custom,anytime,Design GitOps,DG,,_bmad-custom/agents/sam-platform-engineer.md,bmad-agent-custom-ccmp-sam,false,platform-engineer,bmad:Automation-focused reliability-oriented:agent:platform-engineer,Sam,⚙️ Platform Engineer,Create Mode,Design GitOps workflow and automation,output_folder,gitops design
      - |-
        custom,anytime,Deployment Strategy,DST,,_bmad-custom/agents/sam-platform-engineer.md,bmad-agent-custom-ccmp-sam,false,platform-engineer,bmad:Automation-focused reliability-oriented:agent:platform-engineer,Sam,⚙️ Platform Engineer,Create Mode,Plan blue-green canary or rolling deployment,output_folder,deployment strategy

  - name: default-party
    target: _bmad/bmm/teams/default-party.csv
    guard: '"platform-engineer"'
    rows:
      - |-
        "platform-engineer","Sam","Platform Engineer","⚙️","Platform Engineer & DevOps Architect","Expert in CI/CD pipelines, Kubernetes, Infrastructure as Code, GitOps, and observability platforms. Automation-focused, reliability-oriented, developer-productivity minded.","Automation-focused, reliability-oriented. Speaks in pipelines, containers, and deployment strategies. Infrastructure as code advocate. Direct and practical.","Automation First: Automate everything repeatable. Infrastructure as Code: Version control all infrastructure. GitOps: Git as single source of truth. Immutable Infrastructure: Never modify, always replace.","custom","_bmad-custom/agents/sam-platform-engineer.md"

memory_injections:
  - targets:
      - _bmad/_config/agents/bmm-architect.customize.yaml
      - _bmad/_config/agents/bmm-dev.customize.yaml
    anchor: '# Add custom menu'
    on_missing_anchor: fail
    memories:
      - |-
        CCMP uses Proxmox + Ansible + Talos Kubernetes on bare metal infrastructure
      - |-
        Teleport is used for SSH access to all infrastructure nodes
      - |-
        Platform engineering standards at _bmad-custom/memories/platform-engineer/infrastructure-standards.md
      - |-
        Proxmox API token management at _bmad-custom/memories/platform-engineer/api-token-management.md
      - |-
        Gitignored file workflows at _bmad-custom/memories/platform-engineer/gitignored-files.md

slash_commands:
  - id: bmad-agent-custom-{{project}}-sam
    target: .claude/commands/bmad-agent-custom-{{project}}-sam.md
    on_exists: skip
    # Verbatim from the script's SLASHEOF heredoc. The body is a fixed template,
    # not derived from the agent file; only the agent path varies per agent.
    body: |
      ---
      name: 'sam-platform-engineer'
      description: 'Platform Engineer for CI/CD, Kubernetes, IaC, GitOps, observability'
      disable-model-invocation: true
      ---

      You must fully embody this agent's persona and follow all activation instructions exactly as specified. NEVER break character until given an exit command.

      <agent-activation CRITICAL="TRUE">
      1. LOAD the FULL agent file from {project-root}/_bmad-custom/agents/sam-platform-engineer.md
      2. READ its entire contents - this contains the complete agent persona, menu, and instructions
      3. FOLLOW every step in the <activation> section precisely
      4. DISPLAY the welcome/greeting as instructed
      5. PRESENT the numbered menu
      6. WAIT for user input before proceeding
      </agent-activation>

verification:
  # The script computes VERIFY_OK, prints [OK] or [WARN], and never exits
  # nonzero: there is no `exit` statement anywhere in its 240 lines. Parity
  # therefore means warn-only. Strict is opt-in, matching what BMAD-METHOD's
  # own validator learned (#1490 shipped blocking, #1494 reverted to warning).
  on_failure: warn
  required_files:
    - _bmad-custom/agents/sam-platform-engineer.md
    - _bmad-custom/memories/platform-engineer/infrastructure-standards.md
    - _bmad-custom/memories/platform-engineer/api-token-management.md
    - _bmad-custom/memories/platform-engineer/gitignored-files.md
    - _bmad-custom/ccmp-agent-memories.yaml
  csv_contains:
    - target: _bmad/_config/agent-manifest.csv
      needle: '"platform-engineer"'

apply_upstream_patches: none

# DIVERGENCES from the source script, recorded rather than silently resolved.
#
# 1. ccmp-agent-memories.yaml is declared the "single source of truth" in the
#    script header, its section comment, and its closing banner. The script
#    never reads it; line 206 only checks that it exists. The memories were
#    hardcoded in the PLATFORM_MEMORIES bash array. Measured: array 5 entries,
#    yaml 6, installed 5. The yaml extra entry ("Sam (Platform Engineer) custom
#    agent lives at ...") has never reached an agent, and the orders differ.
#    This file reproduces the ARRAY (5, in script order) to hold parity. It is
#    listed under verification.required_files so its absence still fails, which
#    is exactly what the script did. Adopting the 6th entry is a behavior
#    change and needs a deliberate decision.
#
# 2. finding-029's per-project table lists ccmp as applying upstream patches
#    C1 C2 E1 E2 I1 I3. The script contains no patch code. apply_upstream_patches
#    is therefore `none`, and the CCMP port does not exercise that operation.
#
# 3. The awk rule `/^memories: \[\]/ { skip=1; next }` is unreachable. The
#    preceding rule `/^memories:/` already matches `memories: []`. Dead rule,
#    carried forward in neither this file nor the engine.
#
# 4. The script writes the generated memories block to a fixed path,
#    /tmp/memories.yaml, and reads it back inside awk. Two projects running
#    post-update at the same time race on that file and can cross-inject each
#    other's memories. The engine holds the block in memory, so the hazard
#    does not survive the port. Recorded because the shell prior art has it.
